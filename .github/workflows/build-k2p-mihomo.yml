name: Build K2P (mihomo)

# 斐讯 K2P A1/A2 (MT7621A + MT7615D DBDC / 16MB NOR / 128MB RAM) 专用构建。
#
# 与 R4A 的 build-mi-r4a-mihomo.yml 完全独立（互不干扰，R4A 那份保持不动）。
# 使用 trunk/configs/templates/K2P_nano.config，已开：
#   CONFIG_FIRMWARE_INCLUDE_MIHOMO=y    /usr/bin/mihomo        30,802,086 B 未压缩
#   CONFIG_FIRMWARE_INCLUDE_EASYTIER=y  /usr/bin/easytier-core  6,698,364 B 未压缩
#   yacd 面板静态资源                   /usr/share/mihomo/ui/   45 个文件 1,135,385 B
#
# 本轮目标是【验证体积能否装进 16MB NOR】，web 界面改造不在范围内。
#
# 为什么钉 ubuntu-22.04 而不是 ubuntu-latest：
#   Padavan 是 2016 年前后的老构建系统，24.04 上 libncurses5-dev / lib32z1
#   等依赖包已不存在，apt 直接失败（R4A 那份 workflow 已踩过这个坑）。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "mihomo 变体: full=现役二进制原样 / lite=现场按精简 tag 交叉编译"
        type: choice
        options: [full, lite]
        default: full

permissions:
  contents: write

env:
  DEVICE: K2P_nano
  toolchain_pkg: mipsel-linux-uclibc.tar.xz
  toolchain_url: https://github.com/hanwckf/padavan-toolchain/releases/download/v1.1
  # Padavan K2P 固件区实测 (trunk/linux-3.4.x/drivers/mtd/ralink/ralink-flash-map.h):
  #   Bootloader 0x00000-0x30000 / Config 0x30000-0x40000 / Factory 0x40000-0x50000
  #   Kernel 从 0x50000 起, 尾部 0x80000 (512K) 固定留给 /etc/storage
  #   可用 = 0x1000000 - 0x50000 - 0x80000 = 0xF30000 = 15,925,248 B = 15.1875 MiB
  # 注意: OpenWrt 的 firmware 分区是 0xa0000 起 0xf60000 长 (15.375 MiB), 两者不同, 别混用
  # 自限 15.0 MiB 留安全余量
  MAX_TRX_SIZE: 15728640
  PART_SIZE: 15925248
  # 未压缩 mihomo 的精确字节数
  MIHOMO_SIZE: 30802086
  # easytier 版本号 (仅用于命名与说明, 实际以 EASYTIER_URL 为准)
  ET_VER: "0.2.8"
  # easytier raw 字节数: 准备步骤会按实际下载解包结果动态覆盖, 不再手工维护
  EASYTIER_SIZE: 0
  # yacd public/ 原始字节数 (45 个文件)
  YACD_UI_BYTES: 1135385
  # geo 数据(精简版): 只含 CN/JP 与常用集合, 合计约 0.5 MiB, 能塞进固件
  GEO_BASE: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
  GEOIP_SIZE: 0
  GEOSITE_SIZE: 0
  # ---- 二进制来源 ----
  # easytier lite v0.2.5 (mipsel), CI 内下载解包, 不要在本地转存
  # 换版本只需改这一行 + ET_VER
  EASYTIER_URL: https://github.com/thisxxx/EasyTier/releases/download/lite-v0.2.8-20261103-8708296/easytier-lite-linux-mipsel.zip
  # lite 变体的 mihomo 版本与精简 tag
  MIHOMO_REF: v1.18.10
  MIHOMO_TAGS: no_fake_tcp,no_tailscale,no_zerotier,no_easytier,with_low_memory
  # squashfs 块大小 (trunk/vendors/Ralink/MT7621/Makefile 里 mksquashfs -b)
  SQUASHFS_BLOCK: 524288

jobs:
  build:
    name: build K2P_nano (mihomo + easytier + yacd)
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget cpio rsync unzip p7zip-full fakeroot \
            build-essential gcc-multilib g++-multilib \
            zlib1g-dev libmpc-dev libgmp-dev libmpfr-dev \
            gawk flex bison texinfo help2man libtool-bin libltdl-dev \
            gperf gettext autopoint pkg-config python3-docutils \
            libncurses5-dev libncursesw5-dev u-boot-tools squashfs-tools \
            subversion cvs swig nodejs
          sudo apt-get install -y --no-install-recommends lib32z1 lib32stdc++6 || true
          sudo apt-get install -y --no-install-recommends ncurses-base || true

      - name: 准备 /opt/rt-n56u 与交叉工具链
        run: |
          set -e
          sudo mkdir -p /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x /opt/images
          sudo rsync -a --exclude '.git' ./ /opt/rt-n56u/
          sudo chown -R "$(id -u):$(id -g)" /opt/rt-n56u /opt/images
          curl -L --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$toolchain_pkg" \
               "$toolchain_url/$toolchain_pkg"
          sudo tar -xf "$RUNNER_TEMP/$toolchain_pkg" \
               -C /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x
          ls /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin | head -5
          rm -f "$RUNNER_TEMP/$toolchain_pkg"
          sudo mkdir -p /etc/terminfo
          if [ -d /usr/share/terminfo ] && [ ! -e /etc/terminfo/x ]; then
            sudo ln -sf /usr/share/terminfo/x /etc/terminfo/x || true
          fi

      - name: 安装 Go (仅 lite 变体需要)
        if: inputs.variant == 'lite'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 准备二进制（easytier 新版 / 可选精简 mihomo）
        run: |
          set -euo pipefail
          T=/opt/rt-n56u/trunk

          # ---- easytier: 从 release 取 lite mipsel 包, 解出未压缩的 easytier-core ----
          rm -rf /tmp/et && mkdir -p /tmp/et
          curl -fL --retry 3 --retry-delay 5 -o /tmp/et.zip "$EASYTIER_URL"
          unzip -q -o /tmp/et.zip -d /tmp/et
          ET=$(find /tmp/et -type f \( -name 'easytier-lite*' -o -name 'easytier-core*' \) | head -1)
          [ -n "$ET" ] || { echo "::error::压缩包里找不到 easytier 二进制"; unzip -l /tmp/et.zip; exit 1; }
          echo "包内取到: $ET ($(stat -c%s "$ET") 字节)"
          echo "UPX 包 sha256: $(sha256sum "$ET" | cut -d' ' -f1)"
          # release 里发布的是 UPX(lzma) 包, 必须先解开: UPX 版运行时会整体解压进匿名内存, 128MB 机器会 OOM
          if head -c 512 "$ET" | grep -aq 'UPX!'; then
            echo "检测到 UPX 壳, 解包..."
            curl -fsSL --retry 3 -o /tmp/upx.tar.xz \
              "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz"
            tar -xJf /tmp/upx.tar.xz -C /tmp
            /tmp/upx-4.2.4-amd64_linux/upx -d -o /tmp/easytier.raw "$ET" >/dev/null
            ET=/tmp/easytier.raw
            echo "解包后: $(stat -c%s "$ET") 字节"
            echo "解包后 sha256: $(sha256sum "$ET" | cut -d' ' -f1)"
          fi
          install -m 0755 "$ET" "$T/user/easytier/easytier-core"
          EASYSZ=$(stat -c%s "$T/user/easytier/easytier-core")
          echo "EASYTIER_SIZE=$EASYSZ" >> "$GITHUB_ENV"
          echo "ET_SHA256=$(sha256sum "$T/user/easytier/easytier-core" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "easytier-core: $EASYSZ 字节 ($(awk "BEGIN{printf \"%.3f\", $EASYSZ/1048576}") MiB)"

          # ---- mihomo: lite 变体现场交叉编译 (MIPS32 小端软浮点, 全静态) ----
          VARIANT="${{ inputs.variant || 'full' }}"
          if [ "$VARIANT" = "lite" ]; then
            echo "编译精简 mihomo: ref=$MIHOMO_REF tags=$MIHOMO_TAGS"
            rm -rf /tmp/mihomo-src
            git clone --depth 1 -b "$MIHOMO_REF" https://github.com/MetaCubeX/mihomo.git /tmp/mihomo-src
            ( cd /tmp/mihomo-src && \
              CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
              go build -trimpath -ldflags "-s -w -buildid=" -tags "$MIHOMO_TAGS" -o /tmp/mihomo-lite . )
            install -m 0755 /tmp/mihomo-lite "$T/user/mihomo/mihomo"
          else
            echo "使用仓库内现役 mihomo 二进制 (不重编)"
          fi
          MHSZ=$(stat -c%s "$T/user/mihomo/mihomo")
          echo "MIHOMO_SIZE=$MHSZ" >> "$GITHUB_ENV"
          echo "mihomo: $MHSZ 字节 ($(awk "BEGIN{printf \"%.3f\", $MHSZ/1048576}") MiB)  variant=$VARIANT"

          # ---- geo 数据: 精简版 geoip/geosite ----
          # mihomo 在 -d 目录找不到 geoip.metadb 时, 会在解析到 GEOIP 规则的那一刻去 GitHub
          # 拉全量库(8.04 MiB), 整份驻留内存, 拉不到则配置加载直接失败。
          # 128MB 机器 + 国内网络, 这条路基本必挂, 所以固件内预置精简版。
          curl -fL --retry 3 --retry-delay 5 -o "$T/user/mihomo/geoip.metadb" "$GEO_BASE/geoip-lite.metadb"
          curl -fL --retry 3 --retry-delay 5 -o "$T/user/mihomo/geosite.dat"  "$GEO_BASE/geosite-lite.dat"
          GIP=$(stat -c%s "$T/user/mihomo/geoip.metadb"); GST=$(stat -c%s "$T/user/mihomo/geosite.dat")
          echo "GEOIP_SIZE=$GIP" >> "$GITHUB_ENV"
          echo "GEOSITE_SIZE=$GST" >> "$GITHUB_ENV"
          echo "geoip.metadb: $GIP 字节 ($(awk "BEGIN{printf \"%.3f\", $GIP/1048576}") MiB) sha256=$(sha256sum "$T/user/mihomo/geoip.metadb" | cut -d' ' -f1)"
          echo "geosite.dat : $GST 字节 ($(awk "BEGIN{printf \"%.3f\", $GST/1048576}") MiB) sha256=$(sha256sum "$T/user/mihomo/geosite.dat" | cut -d' ' -f1)"
          [ "$GIP" -gt 100000 ] && [ "$GST" -gt 50000 ] || { echo "::error::geo 数据体积异常, 疑似下载到错误页"; exit 1; }

      - name: geo 数据自检（断网状态下用 x86 版 mihomo 验证精简库可用）
        run: |
          set -euo pipefail
          T=/opt/rt-n56u/trunk
          # 这段的目的是证明"离线可用": 如果 lite 库不被接受, mihomo 会去下载全量库,
          # 而 unshare -n 下没有网络, 下载必失败 -> 步骤失败。比肉眼看着像就放过靠谱。
          rm -rf /tmp/geotest && mkdir -p /tmp/geotest
          cp "$T/user/mihomo/geoip.metadb" "$T/user/mihomo/geosite.dat" /tmp/geotest/
          cat > /tmp/geotest/config.yaml <<'CFG'
          mixed-port: 7893
          allow-lan: true
          mode: rule
          log-level: warning
          proxies: []
          proxy-groups: []
          rules:
            - GEOIP,CN,DIRECT
            - MATCH,DIRECT
          CFG
          BEFORE=$(sha256sum /tmp/geotest/geoip.metadb | cut -d' ' -f1)
          curl -fL --retry 3 -o /tmp/mihomo-amd64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/$(echo $MIHOMO_REF)/mihomo-linux-amd64-compatible-$(echo $MIHOMO_REF).gz"
          gzip -dc /tmp/mihomo-amd64.gz > /tmp/mihomo-amd64 && chmod +x /tmp/mihomo-amd64
          set +e
          if sudo unshare -n true 2>/dev/null; then
            sudo unshare -n /tmp/mihomo-amd64 -t -d /tmp/geotest -f /tmp/geotest/config.yaml > /tmp/geotest/out.log 2>&1
            RC=$?
          else
            echo "::warning::unshare 不可用, 改为常规自检(靠 sha256 未变化判断是否触发过下载)"
            /tmp/mihomo-amd64 -t -d /tmp/geotest -f /tmp/geotest/config.yaml > /tmp/geotest/out.log 2>&1
            RC=$?
          fi
          set -e
          cat /tmp/geotest/out.log
          AFTER=$(sha256sum /tmp/geotest/geoip.metadb | cut -d' ' -f1)
          if [ "$RC" -ne 0 ]; then
            echo "::error::离线自检失败(rc=$RC): 精简 geo 库无法满足 GEOIP,CN 规则, 真机上会退化成兜底配置"
            exit 1
          fi
          [ "$BEFORE" = "$AFTER" ] || { echo "::error::自检过程中 geoip.metadb 被改写(触发过下载), 精简库不可用"; exit 1; }
          echo "geo 自检通过: GEOIP,CN 规则在无网络环境下可正常解析, 且未触发任何下载"

      - name: 编译前校验（二进制字节数 / yacd / 模板开关 / 模块注册）
        run: |
          set -e
          T=/opt/rt-n56u/trunk

          # ---- 1. mihomo ----
          BIN=$T/user/mihomo/mihomo
          test -f "$BIN" || { echo "::error::mihomo 二进制缺失: $BIN"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          echo "mihomo: $SIZE 字节 (期望 $MIHOMO_SIZE)"
          [ "$SIZE" -eq "$MIHOMO_SIZE" ] || {
            echo "::error::mihomo 大小异常(应为 $MIHOMO_SIZE 未压缩版): $SIZE"
            echo "::error::UPX 版约 6,331,540 字节, 请换回未压缩原始二进制"
            exit 1; }
          MAGIC=$(od -An -tx1 -N20 "$BIN" | tr -d ' \n')
          case "$MAGIC" in
            7f454c4601*0002000800*) echo "mihomo ELF 头校验通过 (ELF32 / MIPS / 小端)" ;;
            *) echo "::error::mihomo 不是 MIPS32 小端可执行文件: $MAGIC"; exit 1 ;;
          esac
          grep -aq "/lib/ld-uClibc\|/lib/ld-musl\|/lib/ld.so" "$BIN" \
            && { echo "::error::mihomo 疑似动态链接, 需要全静态"; exit 1; } || true

          # ---- 2. easytier-core ----
          ETBIN=$T/user/easytier/easytier-core
          test -f "$ETBIN" || { echo "::error::easytier-core 缺失: $ETBIN"; exit 1; }
          ETSIZE=$(stat -c%s "$ETBIN")
          echo "easytier-core: $ETSIZE 字节  sha256=$(sha256sum "$ETBIN" | cut -d' ' -f1)"
          echo "来源: $(basename "$EASYTIER_URL")"
          # UPX 没解开时体积会掉到 2 MiB 以下, 这条才是有独立意义的校验
          [ "$ETSIZE" -gt 4000000 ] || {
            echo "::error::easytier-core 仅 $ETSIZE 字节, 疑似 UPX 未解包 (UPX 版约 1.9 MB)"
            echo "::error::正常未压缩版应在 6-8 MB 量级"
            exit 1; }
          ETMAGIC=$(od -An -tx1 -N20 "$ETBIN" | tr -d ' \n')
          case "$ETMAGIC" in
            7f454c4601*0002000800*) echo "easytier ELF 头校验通过 (ELF32 / MIPS / 小端)" ;;
            *) echo "::error::easytier-core 不是 MIPS32 小端可执行文件: $ETMAGIC"; exit 1 ;;
          esac

          # ---- 3. yacd 面板 ----
          UI=$T/user/mihomo/ui
          test -f "$UI/index.html" || { echo "::error::yacd 面板缺失: $UI/index.html"; exit 1; }
          UIN=$(find "$UI" -type f | wc -l)
          UIB=$(find "$UI" -type f -printf '%s\n' | awk '{s+=$1} END{print s}')
          echo "yacd: $UIN 个文件, $UIB 字节 (期望 45 个 / $YACD_UI_BYTES 字节)"
          [ "$UIN" -eq 45 ] || { echo "::error::yacd 文件数异常: $UIN"; exit 1; }
          [ "$UIB" -eq "$YACD_UI_BYTES" ] || { echo "::error::yacd 字节数异常: $UIB"; exit 1; }
          grep -q 'ROMFSINST.*ui /usr/share/mihomo/ui' "$T/user/mihomo/Makefile" \
            || { echo "::error::mihomo/Makefile 未安装 ui 目录"; exit 1; }
          grep -q 'external-ui:' "$T/user/mihomo/mihomo-start" \
            || { echo "::error::mihomo-start 未配置 external-ui"; exit 1; }

          # ---- 4. 模板开关 + 模块注册 ----
          CFG=$T/configs/templates/$DEVICE.config
          test -f "$CFG" || { echo "::error::模板不存在: $CFG"; exit 1; }
          grep -q '^CONFIG_FIRMWARE_INCLUDE_MIHOMO=y'    "$CFG" || { echo "::error::$DEVICE 未开 MIHOMO"; exit 1; }
          grep -q '^CONFIG_FIRMWARE_INCLUDE_EASYTIER=y'  "$CFG" || { echo "::error::$DEVICE 未开 EASYTIER"; exit 1; }
          grep -q 'CONFIG_FIRMWARE_INCLUDE_MIHOMO.*+= mihomo'   "$T/user/Makefile" || { echo "::error::user/Makefile 未注册 mihomo"; exit 1; }
          grep -q 'CONFIG_FIRMWARE_INCLUDE_EASYTIER.*+= easytier' "$T/user/Makefile" || { echo "::error::user/Makefile 未注册 easytier"; exit 1; }
          echo "--- 体积相关开关现状 ---"
          grep -E '^CONFIG_FIRMWARE_(INCLUDE|ENABLE)_(MIHOMO|EASYTIER|IPSET|OPENSSH|DROPBEAR|SFTP|OPENSSL_EC|CURL|LANG_CN|USB|TTYD|MINIDLNA)' "$CFG" || true

          # ---- 5. squashfs 块大小 ----
          # 128K 与 512K 实测都是橙灯, 证明与块大小无关, 已恢复 512K(省 ~0.67MB)。
          grep -q 'mksquashfs .*-b 524288' $T/vendors/Ralink/MT7621/Makefile \
            || { echo "::error::MT7621 Makefile 未设置 mksquashfs -b 524288, 体积会超标"; exit 1; }
          echo "squashfs 块大小: $SQUASHFS_BLOCK"
          echo "编译前校验全部通过"

      - name: 编译固件 K2P
        run: |
          set -euo pipefail
          cd /opt/rt-n56u/trunk
          fakeroot ./build_firmware_modify "$DEVICE" 2>&1 | tee /tmp/build.log

      - name: 产物校验（体积 / 三个组件是否真的进了 squashfs）
        run: |
          set -euo pipefail
          # 下面 geo 分项统计会引用 $T, 必须在这里定义 (set -u 下未定义会直接退出)
          T=/opt/rt-n56u/trunk
          cd /opt/rt-n56u/trunk
          ls -l images/

          echo "===== romfs 侧 ====="
          ls -l romfs/usr/bin/mihomo romfs/usr/bin/mihomo-start romfs/usr/bin/easytier-core
          ls -l romfs/usr/share/mihomo/ui/index.html
          R_MH=$(stat -c%s romfs/usr/bin/mihomo)
          R_ET=$(stat -c%s romfs/usr/bin/easytier-core)
          echo "romfs: mihomo=$R_MH easytier=$R_ET"
          [ "$R_MH" -eq "$MIHOMO_SIZE" ]     || { echo "::error::romfs mihomo 大小异常 $R_MH"; exit 1; }
          [ "$R_ET" -eq "$EASYTIER_SIZE" ]   || { echo "::error::romfs easytier 大小异常 $R_ET"; exit 1; }
          test -x romfs/usr/bin/mihomo        || { echo "::error::romfs mihomo 不可执行"; exit 1; }
          test -x romfs/usr/bin/easytier-core || { echo "::error::romfs easytier-core 不可执行"; exit 1; }
          test -f romfs/usr/share/mihomo/ui/index.html || { echo "::error::romfs 缺 yacd index.html"; exit 1; }

          echo "===== squashfs 侧 ====="
          ROOTFS=$(stat -c%s images/ramdisk)
          echo "rootfs(images/ramdisk, squashfs-xz, -b $SQUASHFS_BLOCK): $ROOTFS 字节 ($(awk "BEGIN{printf \"%.2f\", $ROOTFS/1048576}") MiB)"

          UNSQ=""
          for c in ./tools/mksquashfs_xz/unsquashfs "$(command -v unsquashfs || true)" ; do
            if [ -n "$c" ] && [ -x "$c" ]; then UNSQ="$c"; break; fi
          done
          if [ -n "$UNSQ" ]; then
            echo "使用 $UNSQ 抽查 squashfs"
            "$UNSQ" -ll images/ramdisk > /tmp/sq.txt 2>/dev/null || "$UNSQ" -l images/ramdisk > /tmp/sq.txt
            for f in usr/bin/mihomo usr/bin/mihomo-start usr/bin/easytier-core usr/share/mihomo/ui/index.html ; do
              grep -qE "$f\$" /tmp/sq.txt || { echo "::error::squashfs 内找不到 /$f"; exit 1; }
              echo "  OK  /$f"
            done
            SQ_MH=$(awk '/ usr\/bin\/mihomo$/ {print $3}' /tmp/sq.txt | head -1)
            SQ_ET=$(awk '/ usr\/bin\/easytier-core$/ {print $3}' /tmp/sq.txt | head -1)
            echo "squashfs 内 mihomo=$SQ_MH  easytier=$SQ_ET"
            # unsquashfs -ll 在 Padavan 的 ramdisk 上会失败并回退到 -l，而 -l 只输出路径没有大小列，
            # 此时 $3 为空。不要因此 fail — romfs 侧已逐字节校验过，文件存在性上面也验过。
            if [ -n "$SQ_MH" ] && [ -n "$SQ_ET" ]; then
              [ "$SQ_MH" -eq "$MIHOMO_SIZE" ]   || { echo "::error::squashfs mihomo 大小异常 $SQ_MH != $MIHOMO_SIZE"; exit 1; }
              [ "$SQ_ET" -eq "$EASYTIER_SIZE" ] || { echo "::error::squashfs easytier 大小异常 $SQ_ET != $EASYTIER_SIZE"; exit 1; }
            else
              echo "::warning::unsquashfs 输出不含大小列（-l 模式），跳过 squashfs 内大小比对；romfs 侧已校验 mihomo=$MIHOMO_SIZE easytier=$EASYTIER_SIZE"
            fi
            echo "squashfs 内 yacd 条目数: $(grep -c 'usr/share/mihomo/ui/' /tmp/sq.txt)"
          else
            echo "::warning::没有可用的 unsquashfs，跳过 squashfs 抽查"
          fi

          echo "===== 体积审计：romfs 内最大的 15 个文件 ====="
          # pipefail 下 find 会被 head 提前关闭触发 SIGPIPE(141), 用子 shell + || true 兜住
          { find romfs -type f -printf '%s %p\n' | sort -rn | head -15 > /tmp/top15.txt; } || true
          awk '{printf "%9.1f KiB  %s\n", $1/1024, $2}' /tmp/top15.txt

          echo "===== 体积审计：关键文件 / 面板开销 ====="
          ls -l romfs/usr/sbin/httpd romfs/usr/bin/mihomo-start \
                romfs/www/Advanced_Mihomo_Content.asp romfs/www/Advanced_EasyTier_Content.asp \
                2>/dev/null || true
          du -sk romfs/www romfs/usr/share/mihomo/ui 2>/dev/null || true

          echo "===== 单组件压缩占用（同块大小实测）====="
          MK=./tools/mksquashfs_xz/mksquashfs
          MH_SQ=0; ET_SQ=0; UI_SQ=0
          if [ -x "$MK" ]; then
            rm -rf /tmp/sqbase && mkdir -p /tmp/sqbase/usr/bin
            rm -f /tmp/sq_base.sq /tmp/sq_one.sq /tmp/sq_ui.sq
            "$MK" /tmp/sqbase /tmp/sq_base.sq -b "$SQUASHFS_BLOCK" -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null 2>&1
            BASE=$(stat -c%s /tmp/sq_base.sq)
            for pair in "romfs/usr/bin/mihomo:MH" "romfs/usr/bin/easytier-core:ET" ; do
              src=${pair%%:*}; tag=${pair##*:}
              cp -f "$src" /tmp/sqbase/usr/bin/
              rm -f /tmp/sq_one.sq
              "$MK" /tmp/sqbase /tmp/sq_one.sq -b "$SQUASHFS_BLOCK" -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null 2>&1
              V=$(( $(stat -c%s /tmp/sq_one.sq) - BASE ))
              rm -f /tmp/sqbase/usr/bin/$(basename "$src")
              if [ "$tag" = "MH" ]; then MH_SQ=$V; else ET_SQ=$V; fi
            done
            mkdir -p /tmp/sqbase/usr/share/mihomo
            cp -a romfs/usr/share/mihomo/ui /tmp/sqbase/usr/share/mihomo/
            rm -f /tmp/sq_ui.sq
            "$MK" /tmp/sqbase /tmp/sq_ui.sq -b "$SQUASHFS_BLOCK" -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null 2>&1
            UI_SQ=$(( $(stat -c%s /tmp/sq_ui.sq) - BASE ))
            rm -rf /tmp/sqbase/usr/share
            mkdir -p /tmp/sqbase/usr/share/mihomo
            cp -f "$T/user/mihomo/geoip.metadb" "$T/user/mihomo/geosite.dat" /tmp/sqbase/usr/share/mihomo/
            rm -f /tmp/sq_geo.sq
            "$MK" /tmp/sqbase /tmp/sq_geo.sq -b "$SQUASHFS_BLOCK" -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null 2>&1
            GEO_SQ=$(( $(stat -c%s /tmp/sq_geo.sq) - BASE ))
            rm -rf /tmp/sqbase/usr/share
            echo "mihomo        : $MIHOMO_SIZE -> $MH_SQ 字节 ($(awk "BEGIN{printf \"%.3f\", $MH_SQ/1048576}") MiB, $(awk "BEGIN{printf \"%.1f\", 100*$MH_SQ/$MIHOMO_SIZE}")%)"
            echo "easytier-core : $EASYTIER_SIZE -> $ET_SQ 字节 ($(awk "BEGIN{printf \"%.3f\", $ET_SQ/1048576}") MiB, $(awk "BEGIN{printf \"%.1f\", 100*$ET_SQ/$EASYTIER_SIZE}")%)"
            echo "yacd ui       : $YACD_UI_BYTES -> $UI_SQ 字节 ($(awk "BEGIN{printf \"%.3f\", $UI_SQ/1048576}") MiB, $(awk "BEGIN{printf \"%.1f\", 100*$UI_SQ/$YACD_UI_BYTES}")%)"
            echo "geo 数据      : $((GEOIP_SIZE + GEOSITE_SIZE)) -> $GEO_SQ 字节 ($(awk "BEGIN{printf \"%.3f\", $GEO_SQ/1048576}") MiB)"
            echo "四项合计占用  : $((MH_SQ + ET_SQ + UI_SQ + GEO_SQ)) 字节 ($(awk "BEGIN{printf \"%.3f\", ($MH_SQ+$ET_SQ+$UI_SQ+$GEO_SQ)/1048576}") MiB)"
          else
            echo "::warning::找不到 mksquashfs，跳过分项占用统计"
          fi

          echo "===== 最终固件 ====="
          TRX=$(ls images/*.trx | head -1)
          SIZE=$(stat -c%s "$TRX")
          MARGIN=$((MAX_TRX_SIZE - SIZE))
          PARTLEFT=$((PART_SIZE - SIZE))
          echo "TRX: $TRX"
          echo "TRX 字节数:   $SIZE"
          echo "TRX 体积:     $(awk "BEGIN{printf \"%.3f\", $SIZE/1048576}") MiB"
          echo "自限上限:     $MAX_TRX_SIZE 字节 (15.0 MiB)"
          echo "距自限余量:   $MARGIN 字节 ($(awk "BEGIN{printf \"%.3f\", $MARGIN/1048576}") MiB)"
          echo "分区剩余空间: $PARTLEFT 字节 ($(awk "BEGIN{printf \"%.3f\", $PARTLEFT/1048576}") MiB, 分区共 $PART_SIZE)"
          {
            echo "### 体积明细"
            echo ""
            echo "| 项目 | 字节 | MiB |"
            echo "|---|---|---|"
            echo "| rootfs (squashfs xz, -b $SQUASHFS_BLOCK) | $ROOTFS | $(awk "BEGIN{printf \"%.3f\", $ROOTFS/1048576}") |"
            echo "| mihomo 进 squashfs | $MH_SQ | $(awk "BEGIN{printf \"%.3f\", $MH_SQ/1048576}") |"
            echo "| easytier-core 进 squashfs | $ET_SQ | $(awk "BEGIN{printf \"%.3f\", $ET_SQ/1048576}") |"
            echo "| yacd ui 进 squashfs | $UI_SQ | $(awk "BEGIN{printf \"%.3f\", $UI_SQ/1048576}") |"
            echo "| geo 数据进 squashfs | $GEO_SQ | $(awk "BEGIN{printf \"%.3f\", $GEO_SQ/1048576}") |"
            echo "| **trx 合计** | **$SIZE** | **$(awk "BEGIN{printf \"%.3f\", $SIZE/1048576}")** |"
            echo "| 自限 15.0 MiB | $MAX_TRX_SIZE | 15.000 |"
            echo "| 分区 15.1875 MiB | $PART_SIZE | 15.1875 |"
            echo "| 距自限余量 | $MARGIN | $(awk "BEGIN{printf \"%.3f\", $MARGIN/1048576}") |"
            echo ""
            echo "### 组件来源"
            echo ""
            echo "| 组件 | raw 字节 | sha256 |"
            echo "|---|---|---|"
            echo "| mihomo (${{ inputs.variant || 'full' }}) | $MIHOMO_SIZE | -- |"
            echo "| easytier-lite v$ET_VER | $EASYTIER_SIZE | $ET_SHA256 |"
            echo "| geoip.metadb (lite) | $GEOIP_SIZE | -- |"
            echo "| geosite.dat (lite) | $GEOSITE_SIZE | -- |"
            echo ""
            echo "easytier 包: \`$(basename \"$EASYTIER_URL\")\`"
          } | tee size-report.md

          cp -f "$TRX" /opt/images/K2P.trx
          cp -f size-report.md /opt/images/size-report.md

          if [ "$SIZE" -gt "$MAX_TRX_SIZE" ]; then
            echo "::error::固件体积超限 $SIZE > $MAX_TRX_SIZE (15.0 MiB)，装不下，需要继续砍基座"
            exit 1
          fi
          echo "体积校验通过：$SIZE <= $MAX_TRX_SIZE"

          # ---- 交付命名: 裸 trx 直接给文件, 不套压缩包 ----
          # 规则: K2P-<variant>-et<版本>.trx; 若仓库历史 release 里已有同名资产(同 easytier 版本多次构建),
          # 自动加序号: K2P-full-et0.2.7-2.trx / -3.trx, 避免下载到本地互相覆盖
          VARIANT="${{ inputs.variant || 'full' }}"
          BASE="K2P-${VARIANT}-et${ET_VER}"
          NAME="${BASE}.trx"
          N=2
          while curl -sf --retry 3 -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -e --arg n "$NAME" 'any(.[].assets[]?; .name == $n)' >/dev/null 2>&1; do
            NAME="${BASE}-${N}.trx"
            N=$((N+1))
          done
          echo "FW_NAME=$NAME" >> "$GITHUB_ENV"
          echo "最终固件名: $NAME"
          cp -f /opt/images/K2P.trx "/opt/images/$NAME"
          cd /opt/images && md5sum "$NAME" | tee md5sum.txt

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FW_NAME || 'K2P.trx' }}
          path: |
            /opt/images/${{ env.FW_NAME || 'K2P.trx' }}
            /opt/images/md5sum.txt
            /opt/images/size-report.md
          if-no-files-found: warn

      - name: 生成发布版本号
        id: ver
        run: |
          # 每次构建一个独立版本 (日期 + 短 sha), 不覆盖历史 release:
          # 同一天同一 commit 重跑会落到同一 tag, 视为同版本重建。
          VER="$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=K2P-mihomo-${{ inputs.variant || 'full' }}-et${ET_VER}-$VER" >> "$GITHUB_OUTPUT"

      - name: 上传到 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: K2P 固件（内置mihomo ${{ inputs.variant || 'full' }} + easytier v${{ env.ET_VER }}）${{ steps.ver.outputs.ver }}
          body: |
            构建版本 **${{ steps.ver.outputs.ver }}**（每次构建独立 tag，不覆盖历史发布）

            斐讯 K2P A1/A2（MT7621A + MT7615D，16MB NOR / 128MB RAM）Padavan 固件，
            内置 **未压缩** mihomo、easytier-lite **v${{ env.ET_VER }}** 与 yacd 面板静态资源（/usr/share/mihomo/ui）。
            各组件 raw 字节与 sha256 见 size-report.md（随本 release 一同发布）。

            - 附件即刷机文件本身（裸 .trx，非压缩包），命名 `K2P-<变体>-et<easytier版本>.trx`；
              同 easytier 版本重复构建时自动加序号（-2、-3），互不覆盖
            - 校验：md5sum.txt；刷机：Breed → 固件更新 → 选本 trx

            - 模板：`trunk/configs/templates/K2P_nano.config`
            - squashfs 块 512 KiB（xz），Go 静态二进制压缩率明显改善
            - 源码 commit: ${{ github.sha }}
            - 刷机：Breed → 固件更新 → 选本 trx；**只适用于 MT7621 的 A1/A2，B1 是博通芯片不能刷**
            - mihomo 部署：启动脚本加 `/usr/bin/mihomo-start &`，
              订阅地址写 `/etc/storage/mihomo/sub_url.txt`，
              面板 `http://<路由器IP>:9090/ui/`
          files: |
            /opt/images/${{ env.FW_NAME }}
            /opt/images/md5sum.txt
            /opt/images/size-report.md
          fail_on_unmatched_files: true

      - name: 失败时输出日志尾部
        if: failure()
        run: |
          echo "===== build.log (tail 200) ====="
          tail -200 /tmp/build.log 2>/dev/null || echo "无 build.log"
